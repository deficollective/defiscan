<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker></defs>
  <style>.b{fill:#f5f7fa;stroke:#333;stroke-width:1.2}.g{fill:#e8f4ea;stroke:#2d6a3e;stroke-width:1.2}.m{fill:#fdf1e7;stroke:#b4531b;stroke-width:1.2}.e{fill:#eef0f7;stroke:#5b5f8a;stroke-width:1.2;stroke-dasharray:4 3}.t{fill:#222}.s{fill:#555;font-size:11px}.l{stroke:#444;stroke-width:1.2;marker-end:url(#a);fill:none}</style>
  <text x="20" y="28" font-size="17" font-weight="bold" class="t">Resupply on Ethereum: who controls what</text>
  <rect x="40" y="60" width="200" height="60" rx="6" class="g"/><text x="140" y="85" text-anchor="middle" class="t" font-weight="bold">RSUP stakers (GovStaker)</text><text x="140" y="104" text-anchor="middle" class="s">1% to propose, 7-day vote, 30% quorum</text>
  <rect x="40" y="160" width="200" height="50" rx="6" class="g"/><text x="140" y="182" text-anchor="middle" class="t" font-weight="bold">Voter</text><text x="140" y="199" text-anchor="middle" class="s">1-day execution delay</text>
  <rect x="40" y="250" width="200" height="50" rx="6" class="b"/><text x="140" y="272" text-anchor="middle" class="t" font-weight="bold">Core</text><text x="140" y="289" text-anchor="middle" class="s">no owner; obeys Voter + operator grants</text>
  <rect x="300" y="60" width="200" height="60" rx="6" class="m"/><text x="400" y="85" text-anchor="middle" class="t" font-weight="bold">Team multisig 3-of-5</text><text x="400" y="104" text-anchor="middle" class="s">five EOAs, no timelock</text>
  <rect x="300" y="160" width="200" height="50" rx="6" class="m"/><text x="400" y="182" text-anchor="middle" class="t" font-weight="bold">Guardian / TreasuryManager /</text><text x="400" y="199" text-anchor="middle" class="s">UpgradeOperator / VeCrvOperator proxies</text>
  <rect x="300" y="250" width="200" height="50" rx="6" class="b"/><text x="400" y="272" text-anchor="middle" class="t" font-weight="bold">Instant powers</text><text x="400" y="289" text-anchor="middle" class="s">pause pairs, freeze IP exits, veto, treasury</text>
  <rect x="40" y="360" width="140" height="50" rx="6" class="b"/><text x="110" y="382" text-anchor="middle" class="t" font-weight="bold">Registry</text><text x="110" y="399" text-anchor="middle" class="s">pairs, handlers, mint</text>
  <rect x="200" y="360" width="140" height="50" rx="6" class="b"/><text x="270" y="382" text-anchor="middle" class="t" font-weight="bold">reUSD / sreUSD</text><text x="270" y="399" text-anchor="middle" class="s">minter = Registry</text>
  <rect x="360" y="360" width="150" height="50" rx="6" class="b"/><text x="435" y="382" text-anchor="middle" class="t" font-weight="bold">22 ResupplyPairs</text><text x="435" y="399" text-anchor="middle" class="s">oracle, LTV, rates, limits</text>
  <rect x="530" y="360" width="150" height="50" rx="6" class="b"/><text x="605" y="382" text-anchor="middle" class="t" font-weight="bold">InsurancePool</text><text x="605" y="399" text-anchor="middle" class="s">7d cooldown, 1d window</text>
  <rect x="700" y="360" width="150" height="50" rx="6" class="b"/><text x="775" y="382" text-anchor="middle" class="t" font-weight="bold">Handlers, Treasury</text><text x="775" y="399" text-anchor="middle" class="s">redemption, liquidation, fees</text>
  <rect x="360" y="470" width="150" height="50" rx="6" class="e"/><text x="435" y="492" text-anchor="middle" class="t" font-weight="bold">Curve Lend vaults</text><text x="435" y="509" text-anchor="middle" class="s">collateral; Curve DAO</text>
  <rect x="530" y="470" width="150" height="50" rx="6" class="e"/><text x="605" y="492" text-anchor="middle" class="t" font-weight="bold">Fraxlend pairs</text><text x="605" y="509" text-anchor="middle" class="s">collateral; Frax multisig</text>
  <rect x="700" y="470" width="150" height="50" rx="6" class="e"/><text x="775" y="492" text-anchor="middle" class="t" font-weight="bold">crvUSD / frxUSD oracles</text><text x="775" y="509" text-anchor="middle" class="s">Curve aggregator, Chainlink</text>
  <path d="M140,120 L140,160" class="l"/><path d="M140,210 L140,250" class="l"/><path d="M400,120 L400,160" class="l"/><path d="M400,210 L400,250" class="l"/>
  <path d="M300,275 L240,275" class="l"/><text x="270" y="268" text-anchor="middle" class="s">operator grants</text>
  <path d="M110,300 L110,360" class="l"/><path d="M160,300 L270,360" class="l"/><path d="M200,300 L435,360" class="l"/><path d="M220,300 L605,360" class="l"/><path d="M230,300 L775,360" class="l"/>
  <path d="M435,410 L435,470" class="l"/><path d="M470,410 L605,470" class="l"/><path d="M500,410 L775,470" class="l"/>
  <text x="20" y="545" class="s">Solid boxes: Resupply contracts (all owner() = Core). Green: on-chain governance. Orange: multisig path. Dashed: external dependencies.</text>
</svg>
